kind = "web"
previewPath = "/"
title = "Cyber Inspector AI"
version = "1.0.0"
id = "artifacts/cyber-inspector"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25062

[services.development]
run = "pnpm --filter @workspace/cyber-inspector run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cyber-inspector", "run", "build" ]
serve = "static"
publicDir = "artifacts/cyber-inspector/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25062"
BASE_PATH = "/"
